name: CI Build

on: [push, pull_request]

jobs:
  build-windows:
    name: Windows build
    runs-on: windows-latest

    steps:
    - name: Checkout
      uses: actions/checkout@main
    - name: Build
      run: make -f fbdump.mak.windows
    - name: Create artifact
      uses: actions/upload-artifact@main
      with:
        name: windows-executable
        path: build/fbdump.exe
        overwrite: true
        if-no-files-found: error

  build-linux:
    name: Linux build
    runs-on: ubuntu-latest

    steps:
    - name: Checkout main
      uses: actions/checkout@main
      with:
        path: fbdump
    - name: Checkout wincompat
      uses: actions/checkout@main
      with:
        repository: aafemt/wincompat
        path: wincompat
    - name: Build
      run: make -C fbdump -f fbdump.mak.linux
    - name: Create artifact
      uses: actions/upload-artifact@main
      with:
        name: linux-executable
        path: fbdump/build/fbdump
        overwrite: true
        if-no-files-found: error
